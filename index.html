<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriLink AI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f1f8e9;
      color: #1b5e20;
    }
    header {
      background: #2e7d32;
      color: white;
      padding: 25px;
      text-align: center;
    }
    .container {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
    .card {
      background: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 15px;
      box-shadow: 0 3px 10px #ccc;
    }
    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #43a047;
      color: white;
      font-size: 16px;
    }
  </style>
</head>
<body>

<header>
  <h1>🌾 AgriLink AI</h1>
  <p>Farmer Market Linkage & Price Discovery</p>
</header>

<div class="container">

  <div class="card">
    <h2>👨‍🌾 Farmer</h2>
    <p>Sell your crops directly to buyers.</p>
    <button onclick="alert('Farmer section coming soon!')">
      Farmer Portal
    </button>
  </div>

  <div class="card">
    <h2>🛒 Buyer</h2>
    <p>Find crops and connect with farmers.</p>
    <button onclick="alert('Buyer section coming soon!')">
      Buyer Portal
    </button>
  </div>

  <div class="card">
    <h2>📊 Market Prices</h2>
    <p>Check current crop prices and discover better markets.</p>
    <button onclick="alert('Market prices coming soon!')">
      View Prices
    </button>
  </div>

</div>

</body>
</html>
