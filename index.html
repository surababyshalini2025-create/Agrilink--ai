<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AgriLink AI</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f1f8e9;
    color: #1b5e20;
}

header {
    background: #2e7d32;
    color: white;
    padding: 25px;
    text-align: center;
}

.container {
    padding: 20px;
    max-width: 600px;
    margin: auto;
}

.card {
    background: white;
    padding: 25px;
    margin-bottom: 20px;
    border-radius: 20px;
    box-shadow: 0 5px 15px #cccccc;
}

h2 {
    color: #1b5e20;
}

button {
    width: 100%;
    padding: 15px;
    background: #43a047;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    margin-top: 10px;
}

input {
    width: 100%;
    padding: 14px;
    margin: 8px 0 15px 0;
    box-sizing: border-box;
    border: 1px solid #aaa;
    border-radius: 10px;
    font-size: 16px;
}

label {
    font-weight: bold;
}

.hidden {
    display: none;
}

.success {
    background: #e8f5e9;
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
}
</style>
</head>

<body>

<header>
    <h1>🌾 AgriLink AI</h1>
    <p>Farmer Market Linkage & Price Discovery</p>
</header>

<div class="container">

    <!-- HOME -->
    <div id="home">

        <div class="card">
            <h2>👨‍🌾 Farmer</h2>
            <p>Sell your crops directly to buyers.</p>

            <button onclick="showFarmerRegistration()">
                Farmer Portal
            </button>
        </div>

        <div class="card">
            <h2>🛒 Buyer</h2>
            <p>Find crops and connect with farmers.</p>

            <button onclick="alert('Buyer section coming soon!')">
                Buyer Portal
            </button>
        </div>

        <div class="card">
            <h2>📊 Market Prices</h2>
            <p>Check current crop prices and discover better markets.</p>

            <button onclick="alert('Market prices coming soon!')">
                View Prices
            </button>
        </div>

    </div>


    <!-- FARMER REGISTRATION -->
    <div id="farmerRegistration" class="hidden">

        <div class="card">

            <h2>👨‍🌾 Farmer Registration</h2>

            <label>Farmer Name</label>

            <input
                type="text"
                id="farmerName"
                placeholder="Enter your full name"
            >

            <label>Mobile Number</label>

            <input
                type="tel"
                id="mobile"
                placeholder="Enter 10-digit mobile number"
                maxlength="10"
            >

            <label>Village</label>

            <input
                type="text"
                id="village"
                placeholder="Enter village name"
            >

            <label>Crop</label>

            <input
                type="text"
                id="crop"
                placeholder="Example: Rice, Tomato, Onion"
            >

            <button onclick="registerFarmer()">
                Register Farmer
            </button>

            <button
                onclick="goHome()"
                style="background:#777;">
                Back
            </button>

            <div id="successMessage"></div>

        </div>

    </div>


    <!-- FARMER DASHBOARD -->
    <div id="dashboard" class="hidden">

        <div class="card">

            <h2>🌾 Farmer Dashboard</h2>

            <p id="welcomeMessage">
                Welcome, Farmer!
            </p>

            <button onclick="alert('Add Crop feature coming next!')">
                🌾 Add Crop
            </button>

            <button onclick="alert('My Crops feature coming next!')">
                📦 My Crops
            </button>

            <button onclick="alert('Expected Price feature coming next!')">
                💰 Expected Price
            </button>

            <button onclick="alert('Find Buyers feature coming next!')">
                🛒 Find Buyers
            </button>

            <button onclick="alert('Market Prices feature coming next!')">
                📊 Market Prices
            </button>

            <button
                onclick="goHome()"
                style="background:#777;">
                ⬅️ Back to Home
            </button>

        </div>

    </div>

</div>


<script>

function showFarmerRegistration() {

    document.getElementById("home").classList.add("hidden");

    document.getElementById("dashboard").classList.add("hidden");

    document.getElementById("farmerRegistration").classList.remove("hidden");
}


function goHome() {

    document.getElementById("farmerRegistration").classList.add("hidden");

    document.getElementById("dashboard").classList.add("hidden");

    document.getElementById("home").classList.remove("hidden");
}


function registerFarmer() {

    let name = document.getElementById("farmerName").value.trim();

    let mobile = document.getElementById("mobile").value.trim();

    let village = document.getElementById("village").value.trim();

    let crop = document.getElementById("crop").value.trim();


    if (
        name === "" ||
        mobile === "" ||
        village === "" ||
        crop === ""
    ) {

        alert("Please fill all the details.");

        return;
    }


    if (!/^[0-9]{10}$/.test(mobile)) {

        alert("Please enter a valid 10-digit mobile number.");

        return;
    }


    localStorage.setItem("farmerName", name);

    localStorage.setItem("farmerMobile", mobile);

    localStorage.setItem("farmerVillage", village);

    localStorage.setItem("farmerCrop", crop);


    document.getElementById("successMessage").innerHTML =
        '<div class="success">' +
        '<h3>✅ Registration Successful!</h3>' +
        '<p>Welcome, ' + name + '!</p>' +
        '<p>Your farmer profile has been created.</p>' +
        '</div>';


    setTimeout(function() {

        document.getElementById("farmerRegistration").classList.add("hidden");

        document.getElementById("dashboard").classList.remove("hidden");

        document.getElementById("welcomeMessage").innerText =
            "Welcome, " + name + "!";

    }, 1500);

}

</script>

</body>
</html>
