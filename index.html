<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriLink AI</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f1f8e9;
      color: #1b5e20;
    }

    header {
      background: #2e7d32;
      color: white;
      padding: 25px;
      text-align: center;
    }

    .container {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 25px;
      margin: 20px 0;
      border-radius: 15px;
      box-shadow: 0 3px 10px #ccc;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      box-sizing: border-box;
      border: 1px solid #aaa;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      background: #43a047;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      margin-top: 10px;
    }

    button:hover {
      background: #2e7d32;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>🌾 AgriLink AI</h1>
  <p>Farmer Market Linkage & Price Discovery</p>
</header>

<div class="container">

  <div class="card">
    <h2>👨‍🌾 Farmer Registration</h2>

    <label>Farmer Name</label>
    <input type="text" id="farmerName" placeholder="Enter your name">

    <label>Mobile Number</label>
    <input type="tel" id="mobile" placeholder="Enter 10-digit mobile number">

    <button onclick="registerFarmer()">Register</button>

    <p id="message"></p>
  </div>

</div>

<script>
  function registerFarmer() {
    let name = document.getElementById("farmerName").value;
    let mobile = document.getElementById("mobile").value;
    let message = document.getElementById("message");

    if (name === "" || mobile === "") {
      message.innerHTML = "❌ Please enter your name and mobile number.";
      return;
    }

    if (mobile.length !== 10) {
      message.innerHTML = "❌ Please enter a valid 10-digit mobile number.";
      return;
    }

    message.innerHTML = "✅ Registration successful! Welcome " + name + "!";
  }
</script>

</body>
</html>
